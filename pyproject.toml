[project]
name = "psx-auto-update"
version = "0.1.0"
description = "Automate PSX trading confirmations to Google Sheets"
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.116.0",
    "gspread>=6.0.0",
    "pdfplumber>=0.11.0",
    "python-dateutil>=2.8.2",
    "PyYAML>=6.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
